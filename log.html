<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Motion Log</title>
<style>
:root{
  --bg:#000; --surface:#0b0c0e; --raise:#161719; --hi:#202225;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --ink:#fafafa; --mute:#71767c;
  --amber:#ffb04a; --glow:rgba(255,176,74,.16);
  --sans:"Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;justify-content:center;
  padding:40px 20px 56px;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{width:100%;max-width:392px}

.head{margin-bottom:26px}
.title{font-size:23px;font-weight:600;letter-spacing:-.032em;line-height:1.1}
.link{display:flex;align-items:center;gap:7px;margin-top:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute)}
.dot{width:5px;height:5px;border-radius:50%;background:#33363a;transition:background .3s}
.dot.live{background:#5ec97a;box-shadow:0 0 8px rgba(94,201,122,.55)}

.navlink{display:flex;align-items:center;justify-content:center;padding:9px 14px;
  border:1px solid var(--line);border-radius:10px;color:var(--mute);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;transition:color .2s,border-color .2s;flex:none;margin-top:1px}
.navlink:hover{color:var(--ink);border-color:var(--line2)}

.daygroup{margin-top:22px}
.daygroup:first-child{margin-top:0}
.daylabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);margin-bottom:10px;padding-left:2px}
.logrow{display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;margin-top:8px}
.logrow:first-of-type{margin-top:0}
.logtime{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
.logdot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.empty{padding:44px 20px;text-align:center;color:var(--mute);font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  font-family:var(--mono);letter-spacing:.02em}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <h1 class="title">Motion Log</h1>
        <span class="link"><span class="dot" id="dot"></span><span id="linktxt">connecting</span></span>
      </div>
      <a href="index.html" class="navlink">Light</a>
    </div>
  </div>

  <div id="content">
    <div class="empty">No motion logged yet</div>
  </div>

</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const HOST = "0b4cfe2f4fae436596c1cb84b32aacd9.s1.eu.hivemq.cloud";
const PORT = 8884;
const USER = "motionlight";
const PASS = "motionlight1523";

const T_LOG = "eben/light/log";
const T_ONLINE = "eben/light/online";

const $ = i => document.getElementById(i);

function setLink(ok, txt){
  $("dot").classList.toggle("live", ok);
  $("linktxt").textContent = txt;
}

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function groupLabel(ts){
  const d = new Date(ts * 1000);
  const diff = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

function timeLabel(ts){
  return new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function render(list){
  const content = $("content");
  if (!list.length) {
    content.innerHTML = '<div class="empty">No motion logged yet</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => b - a);
  const groups = [];
  let cur = null;
  for (const ts of sorted) {
    const label = groupLabel(ts);
    if (!cur || cur.label !== label) {
      cur = { label, items: [] };
      groups.push(cur);
    }
    cur.items.push(ts);
  }
  content.innerHTML = groups.map(g => `
    <div class="daygroup">
      <div class="daylabel">${g.label}</div>
      ${g.items.map(ts => `
        <div class="logrow">
          <span class="logtime">Motion detected at ${timeLabel(ts)}</span>
          <span class="logdot"></span>
        </div>
      `).join("")}
    </div>
  `).join("");
}

const client = mqtt.connect("wss://" + HOST + ":" + PORT + "/mqtt", {
  username: USER,
  password: PASS,
  clientId: "web-log-" + Math.random().toString(16).slice(2, 10),
  clean: true,
  reconnectPeriod: 3000
});

client.on("connect", () => {
  client.subscribe([T_LOG, T_ONLINE]);
  setLink(true, "connected");
});
client.on("reconnect", () => setLink(false, "reconnecting"));
client.on("close", () => setLink(false, "no link"));
client.on("error", e => { console.error(e); setLink(false, "error"); });

client.on("message", (topic, buf) => {
  const msg = buf.toString();
  if (topic === T_ONLINE) {
    const up = msg === "1";
    setLink(up, up ? "connected" : "device offline");
  } else if (topic === T_LOG) {
    try {
      const data = JSON.parse(msg);
      render(data.log || []);
    } catch (e) {}
  }
});
</script>
</body>
</html>
