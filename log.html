<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Motion Log</title>
<style>
:root{
  --bg:#000; --surface:#0b0c0e; --raise:#161719; --hi:#202225;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --ink:#fafafa; --mute:#71767c;
  --amber:#ffb04a; --glow:rgba(255,176,74,.16);
  --sans:"Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;justify-content:center;
  padding:40px 20px 56px;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{width:100%;max-width:392px}

.head{margin-bottom:26px}
.title{font-size:23px;font-weight:600;letter-spacing:-.032em;line-height:1.1}
.link{display:flex;align-items:center;gap:7px;margin-top:9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute)}
.dot{width:5px;height:5px;border-radius:50%;background:#33363a;transition:background .3s}
.dot.live{background:#5ec97a;box-shadow:0 0 8px rgba(94,201,122,.55)}

.navlink{display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 14px;
  border:1px solid var(--line);border-radius:10px;color:var(--mute);
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;transition:color .2s,border-color .2s;flex:none;margin-top:1px}
.navlink:hover{color:var(--ink);border-color:var(--line2)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:30px 24px 26px;text-align:center;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;opacity:.7;
  background:radial-gradient(circle at 50% 0%,var(--glow),transparent 62%);
  pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);pointer-events:none}
.count{position:relative;font-size:46px;font-weight:600;letter-spacing:-.04em;line-height:1;
  color:var(--mute);font-variant-numeric:tabular-nums;transition:color .35s}
.count.active{color:var(--amber)}
.count-label{position:relative;margin-top:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--mute)}
.lastseen{position:relative;margin-top:16px;padding-top:15px;border-top:1px solid var(--line);
  font-size:13px;color:var(--mute);letter-spacing:-.005em}
.lastseen b{color:var(--ink);font-weight:500}

.daygroup{margin-top:24px}
.daygroup:first-child{margin-top:22px}
.dayhead{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding-left:2px}
.daylabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute)}
.daycount{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--mute);
  background:var(--raise);border:1px solid var(--line);padding:3px 9px;border-radius:20px}

.logrow{display:flex;align-items:center;gap:13px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;margin-top:8px;
  animation:fadeUp .38s cubic-bezier(.2,.8,.3,1) both}
.logrow:first-of-type{margin-top:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 9px rgba(255,176,74,.55);flex:none}
.logbody{flex:1;min-width:0}
.logtime{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
.logago{margin-top:2px;font-family:var(--mono);font-size:10.5px;
  color:var(--mute);letter-spacing:.03em}

.empty{margin-top:22px;padding:46px 20px 40px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:16px}
.empty svg{display:block;margin:0 auto 16px}
.empty p{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute)}

@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <h1 class="title">Motion Log</h1>
        <span class="link"><span class="dot" id="dot"></span><span id="linktxt">connecting</span></span>
      </div>
      <a href="index.html" class="navlink">‹ Light</a>
    </div>
  </div>

  <div class="card">
    <div class="count" id="count">&ndash;</div>
    <div class="count-label">Detections in last 48h</div>
    <div class="lastseen" id="lastseen">Loading&hellip;</div>
  </div>

  <div id="content">
    <div class="empty">
      <svg width="48" height="34" viewBox="0 0 48 34" fill="none">
        <circle cx="24" cy="30" r="3" fill="var(--mute)"/>
        <path d="M14 30a10 10 0 0 1 20 0" stroke="var(--line2)" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 30a16 16 0 0 1 32 0" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>Loading log&hellip;</p>
    </div>
  </div>

</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const HOST = "0b4cfe2f4fae436596c1cb84b32aacd9.s1.eu.hivemq.cloud";
const PORT = 8884;
const USER = "motionlight";
const PASS = "motionlight1523";

const T_LOG = "eben/light/log";
const T_ONLINE = "eben/light/online";

const $ = i => document.getElementById(i);
let lastList = null;

function setLink(ok, txt){
  $("dot").classList.toggle("live", ok);
  $("linktxt").textContent = txt;
}

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function groupLabel(ts){
  const d = new Date(ts * 1000);
  const diff = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

function timeLabel(ts){
  return new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function timeAgo(ts){
  const diff = Math.floor(Date.now() / 1000) - ts;
  if (diff < 45) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function emptyCard(text){
  return `
    <div class="empty">
      <svg width="48" height="34" viewBox="0 0 48 34" fill="none">
        <circle cx="24" cy="30" r="3" fill="var(--mute)"/>
        <path d="M14 30a10 10 0 0 1 20 0" stroke="var(--line2)" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 30a16 16 0 0 1 32 0" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>${text}</p>
    </div>`;
}

function renderSummary(list){
  const count = $("count");
  const lastseen = $("lastseen");
  count.textContent = list.length;
  count.classList.toggle("active", list.length > 0);
  if (!list.length) {
    lastseen.innerHTML = "No motion logged yet";
  } else {
    const latest = Math.max(...list);
    lastseen.innerHTML = "Last seen <b>" + timeAgo(latest) + "</b>";
  }
}

function render(list){
  lastList = list;
  renderSummary(list);
  const content = $("content");
  if (!list.length) {
    content.innerHTML = emptyCard("No motion logged yet");
    return;
  }
  const sorted = [...list].sort((a, b) => b - a);
  const groups = [];
  let cur = null;
  for (const ts of sorted) {
    const label = groupLabel(ts);
    if (!cur || cur.label !== label) {
      cur = { label, items: [] };
      groups.push(cur);
    }
    cur.items.push(ts);
  }
  content.innerHTML = groups.map(g => `
    <div class="daygroup">
      <div class="dayhead">
        <span class="daylabel">${g.label}</span>
        <span class="daycount">${g.items.length}</span>
      </div>
      ${g.items.map((ts, i) => `
        <div class="logrow" style="animation-delay:${Math.min(i, 8) * 35}ms">
          <span class="pulse"></span>
          <span class="logbody">
            <div class="logtime">${timeLabel(ts)}</div>
            <div class="logago">${timeAgo(ts)}</div>
          </span>
        </div>
      `).join("")}
    </div>
  `).join("");
}

const client = mqtt.connect("wss://" + HOST + ":" + PORT + "/mqtt", {
  username: USER,
  password: PASS,
  clientId: "web-log-" + Math.random().toString(16).slice(2, 10),
  clean: true,
  reconnectPeriod: 3000
});

client.on("connect", () => {
  client.subscribe([T_LOG, T_ONLINE]);
  setLink(true, "connected");
});
client.on("reconnect", () => setLink(false, "reconnecting"));
client.on("close", () => setLink(false, "no link"));
client.on("error", e => { console.error(e); setLink(false, "error"); });

client.on("message", (topic, buf) => {
  const msg = buf.toString();
  if (topic === T_ONLINE) {
    const up = msg === "1";
    setLink(up, up ? "connected" : "device offline");
  } else if (topic === T_LOG) {
    try {
      const data = JSON.parse(msg);
      render(data.log || []);
    } catch (e) {}
  }
});

setInterval(() => { if (lastList) render(lastList); }, 30000);
</script>
</body>
</html>
